<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #101828; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475467; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; fill: #344054; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 600; fill: #667085; }
      .conn-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475467; }
      
      .box { rx: 10px; ry: 10px; filter: drop-shadow(0 1px 3px rgba(16, 24, 40, 0.06)); }
      .subgraph { rx: 14px; ry: 14px; stroke-width: 1.5px; fill: #FAFAFC; }
      
      /* Temas por capa */
      .core-box { fill: #EFF8FF; stroke: #2E90FA; stroke-width: 1.5px; }
      .state-box { fill: #ECFDF3; stroke: #12B76A; stroke-width: 1.5px; }
      .public-box { fill: #FFF4ED; stroke: #FB6514; stroke-width: 1.5px; }
      .protected-box { fill: #FDF2FA; stroke: #EE46BC; stroke-width: 1.5px; }
      .hub-box { fill: #FEF0C7; stroke: #F79009; stroke-width: 2px; }
      .backend-box { fill: #F4F3FF; stroke: #7A5AF8; stroke-width: 1.5px; }
      
      /* Líneas */
      .arrow { stroke: #667085; stroke-width: 1.6px; fill: none; }
      .arrow-dashed { stroke: #12B76A; stroke-width: 1.6px; stroke-dasharray: 5 4; fill: none; }
      .arrow-accent { stroke: #EE46BC; stroke-width: 2px; fill: none; }
      .arrow-backend { stroke: #7A5AF8; stroke-width: 2px; fill: none; }
      .label-bg { fill: #FFFFFF; rx: 4px; ry: 4px; stroke: #EAECF0; stroke-width: 1px; }
    </style>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>

    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#667085" />
    </marker>
    <marker id="arrowhead-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#EE46BC" />
    </marker>
    <marker id="arrowhead-dashed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#12B76A" />
    </marker>
    <marker id="arrowhead-backend" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#7A5AF8" />
    </marker>
  </defs>

  <!-- ================= CAPA 1: SHELL & CORE ================= -->
  <rect class="subgraph" x="25" y="20" width="585" height="120" stroke="#B2DDFF" />
  <text class="group-title" x="42" y="42">Shell &amp; Core</text>

  <!-- main.ts -->
  <g class="box" filter="url(#shadow)">
    <rect class="core-box" x="40" y="55" width="115" height="65" rx="8" />
    <text class="title" x="97" y="82" text-anchor="middle">main.ts</text>
    <text class="subtitle" x="97" y="100" text-anchor="middle">bootstrapApp</text>
  </g>

  <!-- app.config.ts -->
  <g class="box" filter="url(#shadow)">
    <rect class="core-box" x="180" y="55" width="125" height="65" rx="8" />
    <text class="title" x="242" y="82" text-anchor="middle">app.config.ts</text>
    <text class="subtitle" x="242" y="100" text-anchor="middle">providers &amp; routes</text>
  </g>

  <!-- App (Shell) -->
  <g class="box" filter="url(#shadow)">
    <rect class="core-box" x="330" y="55" width="135" height="65" rx="8" />
    <text class="title" x="397" y="82" text-anchor="middle">App (Shell)</text>
    <text class="subtitle" x="397" y="100" text-anchor="middle">Audio &amp; Outlet</text>
  </g>

  <!-- TopNav -->
  <g class="box" filter="url(#shadow)">
    <rect class="core-box" x="485" y="55" width="110" height="65" rx="8" />
    <text class="title" x="540" y="82" text-anchor="middle">TopNav</text>
    <text class="subtitle" x="540" y="100" text-anchor="middle">Audio &amp; Nav</text>
  </g>

  <!-- Flechas Core -->
  <line class="arrow" x1="155" y1="87" x2="178" y2="87" marker-end="url(#arrowhead)" />
  <line class="arrow" x1="305" y1="87" x2="328" y2="87" marker-end="url(#arrowhead)" />
  <line class="arrow" x1="465" y1="87" x2="483" y2="87" />

  <!-- ================= CAPA 1: SERVICIOS GLOBALES ================= -->
  <rect class="subgraph" x="635" y="20" width="360" height="120" stroke="#A6F4C5" />
  <text class="group-title" x="652" y="42">Servicios Globales (Signals)</text>

  <!-- AudioService -->
  <g class="box" filter="url(#shadow)">
    <rect class="state-box" x="650" y="55" width="155" height="65" rx="8" />
    <text class="title" x="727" y="82" text-anchor="middle">AudioService</text>
    <text class="subtitle" x="727" y="100" text-anchor="middle">currentSong Signal</text>
  </g>

  <!-- AuthService -->
  <g class="box" filter="url(#shadow)">
    <rect class="state-box" x="825" y="55" width="155" height="65" rx="8" />
    <text class="title" x="902" y="82" text-anchor="middle">AuthService</text>
    <text class="subtitle" x="902" y="100" text-anchor="middle">isLoggedIn &amp; Storage</text>
  </g>

  <!-- ================= CAPA 2: RUTAS PÚBLICAS ================= -->
  <rect class="subgraph" x="25" y="185" width="315" height="145" stroke="#FEDF89" />
  <text class="group-title" x="42" y="208">Rutas Públicas</text>

  <!-- Login (TarjetaInicio) -->
  <g class="box" filter="url(#shadow)">
    <rect class="public-box" x="40" y="225" width="130" height="85" rx="8" />
    <text class="title" x="105" y="255" text-anchor="middle">/ (TarjetaInicio)</text>
    <text class="subtitle" x="105" y="275" text-anchor="middle">Validación clave</text>
    <text class="badge-text" x="105" y="293" text-anchor="middle">max 3 intentos</text>
  </g>

  <!-- Impostor -->
  <g class="box" filter="url(#shadow)">
    <rect class="public-box" x="205" y="225" width="120" height="85" rx="8" />
    <text class="title" x="265" y="255" text-anchor="middle">/impostor</text>
    <text class="subtitle" x="265" y="275" text-anchor="middle">Pantalla bloqueo</text>
    <text class="badge-text" x="265" y="293" text-anchor="middle">Acceso fallido</text>
  </g>

  <line class="arrow" x1="170" y1="267" x2="203" y2="267" marker-end="url(#arrowhead)" />
  <rect class="label-bg" x="171" y="248" width="32" height="15" />
  <text class="conn-label" x="187" y="259" text-anchor="middle">fallo</text>

  <!-- ================= CAPA 2: ZONA PROTEGIDA ================= -->
  <rect class="subgraph" x="365" y="185" width="630" height="380" stroke="#FCCEEE" />
  <text class="group-title" x="385" y="208">Zona Protegida: /regalo (authGuard)</text>

  <!-- Home (Hub) -->
  <g class="box" filter="url(#shadow)">
    <rect class="hub-box" x="550" y="225" width="230" height="75" rx="8" />
    <text class="title" x="665" y="253" text-anchor="middle">Home (Hub Central)</text>
    <text class="subtitle" x="665" y="271" text-anchor="middle">Selector canciones + Modal Clave</text>
    <text class="badge-text" x="665" y="287" text-anchor="middle">Desbloqueo regalo secreto</text>
  </g>

  <!-- Contenedor Destinos -->
  <rect x="385" y="325" width="590" height="220" rx="10" ry="10" fill="#FFFFFF" stroke="#F670C7" stroke-dasharray="4 4" stroke-width="1.2px" />
  <text class="badge-text" x="400" y="344">DESTINOS Y PISTAS DEL REGALO</text>

  <!-- Cortis -->
  <g class="box" filter="url(#shadow)">
    <rect class="protected-box" x="400" y="360" width="130" height="100" rx="8" />
    <text class="title" x="465" y="388" text-anchor="middle">/cortis</text>
    <text class="subtitle" x="465" y="408" text-anchor="middle">Bento Bias K-Pop</text>
    <text class="subtitle" x="465" y="424" text-anchor="middle">Galería + Video</text>
    <rect x="406" y="435" width="118" height="18" rx="4" fill="#FCE4EC" />
    <text class="badge-text" x="465" y="448" text-anchor="middle" fill="#C2185B">Pista Conceptual #1</text>
  </g>

  <!-- Personajes -->
  <g class="box" filter="url(#shadow)">
    <rect class="protected-box" x="545" y="360" width="135" height="100" rx="8" />
    <text class="title" x="612" y="388" text-anchor="middle">/personajes</text>
    <text class="subtitle" x="612" y="408" text-anchor="middle">Grid Personajes</text>
    <text class="subtitle" x="612" y="424" text-anchor="middle">Minijuego Trivia</text>
    <rect x="553" y="435" width="118" height="18" rx="4" fill="#FCE4EC" />
    <text class="badge-text" x="612" y="448" text-anchor="middle" fill="#C2185B">Pista Conceptual #2</text>
  </g>

  <!-- Pusheen -->
  <g class="box" filter="url(#shadow)">
    <rect class="protected-box" x="695" y="360" width="130" height="100" rx="8" />
    <text class="title" x="760" y="388" text-anchor="middle">/pusheen</text>
    <text class="subtitle" x="760" y="408" text-anchor="middle">Buzón Sobres</text>
    <text class="subtitle" x="760" y="424" text-anchor="middle">Video desbloqueo</text>
    <rect x="701" y="435" width="118" height="18" rx="4" fill="#FCE4EC" />
    <text class="badge-text" x="760" y="448" text-anchor="middle" fill="#C2185B">Pista Conceptual #3</text>
  </g>

  <!-- Secreto -->
  <g class="box" filter="url(#shadow)">
    <rect class="protected-box" x="840" y="360" width="120" height="100" rx="8" />
    <text class="title" x="900" y="388" text-anchor="middle">/secreto</text>
    <text class="subtitle" x="900" y="408" text-anchor="middle">Carta Personal</text>
    <text class="subtitle" x="900" y="424" text-anchor="middle">Video + Feedback</text>
    <rect x="850" y="435" width="100" height="18" rx="4" fill="#F3E8FF" stroke="#D8B4FE" />
    <text class="badge-text" x="900" y="448" text-anchor="middle" fill="#6B21A8">Regalo Final 🎁</text>
  </g>

  <!-- Conexiones Home -> Destinos -->
  <path class="arrow" d="M 610 300 L 610 330 L 465 330 L 465 358" marker-end="url(#arrowhead)" />
  <path class="arrow" d="M 640 300 L 640 330 L 612 330 L 612 358" marker-end="url(#arrowhead)" />
  <path class="arrow" d="M 690 300 L 690 330 L 760 330 L 760 358" marker-end="url(#arrowhead)" />
  <path class="arrow-accent" stroke-dasharray="4 3" d="M 720 300 L 720 330 L 900 330 L 900 358" marker-end="url(#arrowhead-accent)" />
  <rect class="label-bg" x="850" y="322" width="100" height="16" />
  <text class="conn-label" x="900" y="334" text-anchor="middle" fill="#EE46BC">Clave descifrada</text>

  <!-- ================= CAPA 3: BACKEND SERVERLESS ================= -->
  <rect class="subgraph" x="720" y="605" width="275" height="115" stroke="#D6BBFB" />
  <text class="group-title" x="735" y="628">Backend Serverless</text>

  <!-- api/send.js -->
  <g class="box" filter="url(#shadow)">
    <rect class="backend-box" x="740" y="640" width="235" height="65" rx="8" />
    <text class="title" x="857" y="667" text-anchor="middle">api/send.js</text>
    <text class="subtitle" x="857" y="685" text-anchor="middle">Vercel Function + Resend Email API</text>
  </g>

  <!-- Conexión Secreto -> Backend -->
  <path class="arrow-backend" d="M 900 460 L 900 635" marker-end="url(#arrowhead-backend)" />
  <rect class="label-bg" x="840" y="572" width="120" height="18" />
  <text class="conn-label" x="900" y="585" text-anchor="middle" fill="#7A5AF8">POST /api/send</text>

  <!-- ================= CONEXIONES CRUZADAS ESTRATÉGICAS ================= -->
  <!-- Shell -> PublicRoutes -->
  <path class="arrow" d="M 350 120 L 350 160 L 105 160 L 105 222" marker-end="url(#arrowhead)" />
  <rect class="label-bg" x="70" y="152" width="70" height="16" />
  <text class="conn-label" x="105" y="164" text-anchor="middle">Ruta inicial</text>

  <!-- Shell -> ProtectedZone -->
  <path class="arrow-accent" d="M 440 120 L 440 160 L 665 160 L 665 222" marker-end="url(#arrowhead-accent)" />
  <rect class="label-bg" x="620" y="152" width="90" height="16" />
  <text class="conn-label" x="665" y="164" text-anchor="middle" fill="#EE46BC">authGuard</text>

  <!-- Login -> AuthService -->
  <path class="arrow-dashed" d="M 170 240 L 195 240 L 195 148 L 860 148 L 860 123" marker-end="url(#arrowhead-dashed)" />
  <rect class="label-bg" x="485" y="140" width="80" height="16" />
  <text class="conn-label" x="525" y="152" text-anchor="middle" fill="#12B76A">signIn()</text>

  <!-- TopNav -> AudioService -->
  <path class="arrow-dashed" d="M 595 87 L 647 87" marker-end="url(#arrowhead-dashed)" />

  <!-- Home -> AudioService -->
  <path class="arrow-dashed" d="M 720 225 L 720 123" marker-end="url(#arrowhead-dashed)" />
  <rect class="label-bg" x="680" y="168" width="80" height="16" />
  <text class="conn-label" x="720" y="180" text-anchor="middle" fill="#12B76A">changeSong()</text>

</svg>
