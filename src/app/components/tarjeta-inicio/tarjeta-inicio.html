<article class="card" aria-labelledby="login-title">
  <header>
    <h1 id="login-title">¿Sos la verdadera Tiara?</h1>
    
    <img class="emoji-pusheen" 
         src="assets/images/pusheen/emotions/angry/pusheen-suspicious.gif" 
         alt="Pusheen sospechando" 
         width="110"
         fetchpriority="high"
         decoding="async">
         
    <label for="contrasena">
      Ingresá la contraseña secreta para acceder a tu regalo:
    </label>
  </header>

  <form class="input-group" [class.shake]="state.errorAnimation" (submit)="$event.preventDefault(); verifyPassword(inputPass)">
    <input
      #inputPass
      id="contrasena"
      type="password"
      placeholder="Tu contraseña..."
      title="Ejemplo: tiara123"
    >
    <button title="Ingresar" aria-label="Ingresar contraseña" type="submit">
      Entrar
    </button>
  </form>

  <footer class="error-container" aria-live="assertive" role="alert">
    @if (state.showEmptyWarning) {
      <p class="error-text">¡Ey! No ingresaste ninguna contraseña. 😾</p>
    } @else if (state.showAttemptError) {
      <p class="error-text">
          Contraseña incorrecta. Te quedan {{ config.maxAttempts - state.attempts }} intentos.
      </p>
    }
  </footer>
</article>
